<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Swufe Netool GUI</title>
</head>
<body>

    <div class="main-layout">
        <div class="pos-layout">
            <div class="pos-dorm-static">宿舍</div>
            <div class="pos-edu-static">教学区</div>
        </div>

        <div class="isp-dorm-layout">
            <div class="isp-dorm-cmcc-static">移动</div>
            <div class="isp-dorm-cucc-static">联通</div>
            <div class="isp-dorm-cnet-static">电信</div>
        </div>
        <div class="isp-edu-layout">
            <div class="isp-edu-iswufe-static">iSwufe</div>
            <div class="isp-edu-edu-static">Eduroam</div>
        </div>

        <div class="input-layout">
            <div class="acc-layout">
                <div class="acc-static">学号</div>
                <div class="acc-input"></div>
                <div class="acc-domain-static">@swufe.edu.cn</div>
            </div>
            <div class="pwd-layout">
                <div class="pwd-static">密码</div>
                <div class="pwd-input"></div>
            </div>
        </div>
    </div>

</body>
</html>
