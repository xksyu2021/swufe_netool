<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" type="text/css" href="./style/template.css">
    <link rel="stylesheet" type="text/css" href="./style/apply.css">
    <script type="module" src="../dist/render.js"></script>
    <title>Swufe Netool GUI</title>
</head>
<body>

    <!--
    class   <>-layout | <>-static | <>-input
            static includes text and fake buttons.
    id      bt-<> | layout-<> | input-<> | st-<>
            st means text.
    -->

    <div class="main-layout no-select">
        <div class="select-layout col">
            <div class="pos-layout row">
                <div class="pos-static">位置&emsp;</div>
                <div class="pos-dorm-static bt" id="bt-dorm">宿舍</div>
                <div class="pos-teach-static bt" id="bt-teach">教学区</div>
            </div>

            <div class="isp-dorm-layout row" id="layout-dorm">
                <div class="isp-static">运营商</div>
                <div class="isp-cmcc-static bt" id="bt-cmcc">移动</div>
                <div class="isp-cucc-static bt" id="bt-cucc">联通</div>
                <div class="isp-cnet-static bt" id="bt-cnet">电信</div>
            </div>
            <div class="isp-teach-layout row" id="layout-teach">
                <div class="pos-static">运营商</div>
                <div class="isp-iswufe-static bt" id="bt-iswufe">iSwufe</div>
                <div class="isp-edu-static bt" id="bt-edu">Eduroam</div>
            </div>
        </div>

        <div class="input-layout col">
            <div class="acc-layout row">
                <div class="acc-static">学号</div>
                <label>
                    <input type="text" class="acc-input" id="ipt-acc">
                </label>
                <div class="acc-domain-static" id="st-domain">@swufe.edu.cn</div>
            </div>
            <div class="pwd-layout row">
                <div class="pwd-static">密码</div>
                <label>
                    <input type="password" class="pwd-input" id="ipt-pwd"/>
                </label>
            </div>
        </div>

        <div class="conn-bt bt" id="bt-conn">连接</div>
    </div>

</body>
</html>
