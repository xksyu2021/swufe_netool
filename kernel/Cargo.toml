[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
secrecy = "0.10.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
rpassword = "7.5.4"
md-5 = "0.11.0"
sha1 = "0.11.0"
hmac = "0.13.0"
serde_json = "1.0.151"

[dependencies.windows]
version = ">=0.59, <=0.62"
features = ["Data_Xml_Dom", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Devices", "Devices_WiFi"]
